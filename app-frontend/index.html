<!-- app-frontend/index.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hello World</title>
  <style>body{font-family:Arial; margin:2rem;} .status{font-weight:bold;}</style>
</head>
<body>
  <h1>Two-tier App (Frontend)</h1>
  <div id="output">Loading...</div>

  <script>
    async function fetchStatus(){
      try {
        const resp = await fetch('/api/status-proxy');
        if(!resp.ok) throw new Error('Network response not ok');
        const data = await resp.json();
        document.getElementById('output').innerHTML = `
          <div>Status: <span class="status">${data.status}</span></div>
          <div>Timestamp: ${data.timestamp}</div>
          <div>Service: ${data.service || 'backend'}</div>
        `;
      } catch(e) {
        document.getElementById('output').textContent = 'Error: ' + e.message;
      }
    }
    fetchStatus();
    setInterval(fetchStatus, 15000);
  </script>
</body>
</html>
